name: Deploy Arrow App

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arrow-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Arrow to installed production sites
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip arrow deploy]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify and deploy the pushed commit
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          fingerprint: ${{ secrets.SERVER_SSH_FINGERPRINT }}
          script: |
            set -euo pipefail
            APP_DIR=/home/frappe/frappe-bench/apps/arrow
            cd "$APP_DIR"
            if [ -n "$(git status --porcelain)" ]; then
              echo "REFUSING: production app repository contains local changes."
              git status --short
              exit 1
            fi
            git fetch --quiet upstream develop
            git cat-file -e "${{ github.sha }}^{commit}"
            git checkout --detach --force "${{ github.sha }}"
            exec bash deployment/deploy-arrow.sh "${{ github.sha }}"
          command_timeout: 25m
